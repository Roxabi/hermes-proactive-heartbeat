name: proactive-heartbeats
version: 0.2.0
manifest_version: 1
api_version: 1
kind: standalone
description: Proactive heartbeats for Hermes that decide before the model call — deterministic rules and optional batched TypeSafe judgments, so a tick with nothing to report costs no LLM wake.
author: Roxabi
license: MIT
homepage: https://github.com/Roxabi/hermes-proactive-heartbeats
tags: [automation, heartbeat, monitoring, cron]
requires_hermes: ">=0.21.3"
provides_tools: []
provides_hooks: []
optional_env:
  - name: TYPESAFE_API_KEY
    description: Optional TypeSafe API key for semantic decisions; direct rules never use it, and configured fallbacks apply without it.
    secret: true
config_schema:
  config_dir:
    type: str
    default: "proactive-heartbeats"
    description: "Plugin config directory under HERMES_HOME."
